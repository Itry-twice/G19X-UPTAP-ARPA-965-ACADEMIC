name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-dotnet:
    name: Build y tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: |
          dotnet build services/PluriOne.Shared/PluriOne.Shared.csproj -c Release
          dotnet build services/auth-service/PluriOne.AuthService.csproj -c Release
          dotnet build services/onboarding-service/PluriOne.OnboardingService.csproj -c Release
          dotnet build services/hr-service/PluriOne.HrService.csproj -c Release
          dotnet build services/web/PluriOne.Web.csproj -c Release

      - name: Test
        run: dotnet test tests/PluriOne.Tests/PluriOne.Tests.csproj -c Release --no-restore

  test-python:
    name: Tests (AI Service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          cd services/ai-service
          pip install pytest

      - name: Compile check
        run: |
          cd services/ai-service
          python -m compileall app ingest_cli.py

      - name: Test
        run: |
          cd services/ai-service
          python -m pytest tests -v

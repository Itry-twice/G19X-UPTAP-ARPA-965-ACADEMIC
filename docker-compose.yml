name: plurione

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: plurione-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-plurione}
      SVC_AUTH_PASSWORD: ${SVC_AUTH_PASSWORD:?SVC_AUTH_PASSWORD required}
      SVC_ONBOARDING_PASSWORD: ${SVC_ONBOARDING_PASSWORD:?SVC_ONBOARDING_PASSWORD required}
      SVC_HR_PASSWORD: ${SVC_HR_PASSWORD:?SVC_HR_PASSWORD required}
      SVC_AI_PASSWORD: ${SVC_AI_PASSWORD:?SVC_AI_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plurione}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: plurione-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-service:
    build:
      context: ./services
      dockerfile: auth-service/Dockerfile
    container_name: plurione-auth-service
    environment: &svc_env
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PluriOne: Host=postgres;Port=5432;Database=${POSTGRES_DB:-plurione};Username=svc_auth;Password=${SVC_AUTH_PASSWORD};Include Error Detail=true
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY required}
      Jwt__Issuer: ${JWT_ISSUER:-plurione-auth}
      Jwt__Audience: ${JWT_AUDIENCE:-plurione}
      Jwt__AccessMinutes: ${JWT_ACCESS_MINUTES:-30}
      Jwt__RefreshDays: ${JWT_REFRESH_DAYS:-7}
      SeedDemo: ${SEED_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  onboarding-service:
    build:
      context: ./services
      dockerfile: onboarding-service/Dockerfile
    container_name: plurione-onboarding-service
    environment:
      <<: *svc_env
      ConnectionStrings__PluriOne: Host=postgres;Port=5432;Database=${POSTGRES_DB:-plurione};Username=svc_onboarding;Password=${SVC_ONBOARDING_PASSWORD};Include Error Detail=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  hr-service:
    build:
      context: ./services
      dockerfile: hr-service/Dockerfile
    container_name: plurione-hr-service
    environment:
      <<: *svc_env
      ConnectionStrings__PluriOne: Host=postgres;Port=5432;Database=${POSTGRES_DB:-plurione};Username=svc_hr;Password=${SVC_HR_PASSWORD};Include Error Detail=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ai-service:
    build:
      context: ./services/ai-service
    container_name: plurione-ai-service
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://svc_ai:${SVC_AI_PASSWORD}@postgres:5432/${POSTGRES_DB:-plurione}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY required}
      JWT_ISSUER: ${JWT_ISSUER:-plurione-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-plurione}
      HR_SERVICE_URL: http://hr-service:8080
    volumes:
      - ./docs-source:/app/docs-source:ro
      - ai_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./services
      dockerfile: web/Dockerfile
    container_name: plurione-web
    environment:
      <<: *svc_env
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8080}
      ONBOARDING_SERVICE_URL: ${ONBOARDING_SERVICE_URL:-http://onboarding-service:8080}
      HR_SERVICE_URL: ${HR_SERVICE_URL:-http://hr-service:8080}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8080}
      SessionCookieSecure: ${SESSION_COOKIE_SECURE:-false}
      AppBaseUrl: ${APP_BASE_URL:-http://localhost}
    depends_on:
      auth-service:
        condition: service_healthy
      onboarding-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: plurione-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/Account/Login"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ai_uploads:

networks:
  frontend:
  backend:
    internal: false
